x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"
    compress: "${LOG_COMPRESS:-true}"
services:
  flotilla:
    container_name: flotilla
    image: ghcr.io/coracle-social/flotilla:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      VITE_DEFAULT_PUBKEYS: ${VITE_DEFAULT_PUBKEYS:-}
      VITE_PLATFORM_URL: ${VITE_PLATFORM_URL:-}
      VITE_PLATFORM_NAME: ${VITE_PLATFORM_NAME:-}
      VITE_PLATFORM_LOGO: ${VITE_PLATFORM_LOGO:-}
      VIRTUAL_PORT: ${VIRTUAL_PORT}
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    networks:
      - flotilla-network
      - letsencrypt-network
networks:
  flotilla-network:
    name: flotilla-network
  letsencrypt-network:
    external: true
